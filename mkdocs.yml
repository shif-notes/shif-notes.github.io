site_name: shif-notes
site_url: https://sitename.example
theme:
  name: material
  font:
    text: Merriweather Sans
    code: Red Hat Mono
  icon:
    logo: fontawesome/solid/pen-to-square
  # favicon: fontawesome/solid/pen-to-square
  palette:
      # Light Mode
    # - scheme: default
      # toggle:
        # icon: material/weather-night
        # name: Light mode
      primary: custom
      accent: custom
      
    # # Dark Mode
    # - scheme: custom
    #   toggle:
    #     icon: material/weather-sunny
    #     name: Dark mode
    #   primary: custom
    #   accent: custom

extra_css:
  - stylesheets/extra.css

# repo_url: https://github.com/shif-notes/shif-notes.github.io
plugins:
  - search:
  - blog:
      blog_dir: .
  


markdown_extensions:
  - attr_list
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
